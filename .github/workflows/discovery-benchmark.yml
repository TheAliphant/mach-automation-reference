name: MACH Agent Discovery Benchmark

on:
  push:
    branches:
      - discovery-sidecar-v1
    paths:
      - ".github/workflows/discovery-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark Wellknown natural-language search
        run: |
          set -euo pipefail
          HANDLE="mach-agent-lab-edge"
          QUERIES=(
            "normalize JSON"
            "classify a URL without fetching"
            "validate EVM wallet address format"
            "lab-only A2A agent for capability discovery"
          )

          for Q in "${QUERIES[@]}"; do
            ENCODED=$(jq -rn --arg v "$Q" '$v|@uri')
            curl -fsS "https://wellknown.network/api/v1/search?q=$ENCODED&limit=20" -o /tmp/search.json
            RANK=$(jq -r --arg h "$HANDLE" '
              [(.results // .items // .agents // [])[] | (.handle // .agent.handle // .id // "")] |
              to_entries |
              map(select(.value == $h)) |
              if length > 0 then (.[0].key + 1) else 0 end
            ' /tmp/search.json)
            COUNT=$(jq -r '(.results // .items // .agents // []) | length' /tmp/search.json)
            echo "WELLKNOWN | query=$Q | rank=$RANK | page_results=$COUNT"
          done

      - name: Benchmark Wellknown ARD search
        run: |
          set -euo pipefail
          IDENTIFIER="urn:air:mach-agent-lab-edge.vercel.app:agent:mach-agent-lab-edge"
          QUERIES=(
            "normalize JSON"
            "classify URL without fetching"
            "validate EVM wallet address format"
            "capability discovery A2A agent"
          )

          for Q in "${QUERIES[@]}"; do
            PAYLOAD=$(jq -nc --arg q "$Q" '{
              query:{text:$q,filter:{type:["application/a2a-agent-card+json"]}},
              federation:"local",
              pageSize:20
            }')
            curl -fsS               -X POST "https://wellknown.network/ard/search"               -H "Content-Type: application/json"               -d "$PAYLOAD"               -o /tmp/ard-search.json
            RANK=$(jq -r --arg id "$IDENTIFIER" '
              [(.entries // .results // .items // [])[] | (.identifier // .entry.identifier // "")] |
              to_entries |
              map(select(.value == $id)) |
              if length > 0 then (.[0].key + 1) else 0 end
            ' /tmp/ard-search.json)
            COUNT=$(jq -r '(.entries // .results // .items // []) | length' /tmp/ard-search.json)
            echo "ARD | query=$Q | rank=$RANK | page_results=$COUNT"
          done
