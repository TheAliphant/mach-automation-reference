name: Publish MACH Agent Lab to Neuronto

on:
  push:
    branches:
      - discovery-sidecar-v1
    paths:
      - ".github/workflows/neuronto-distribution.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

jobs:
  publish-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Submit, audit and benchmark ARD
        run: |
          set -euo pipefail
          DOMAIN="mach-agent-lab-edge.vercel.app"

          MCP_ENDPOINT="https://mach-agent-lab-edge.vercel.app/api/mcp"
          MCP_PAYLOAD=$(jq -nc --arg endpoint "$MCP_ENDPOINT" '{endpoint:$endpoint}')
          MCP_STATUS=$(curl -sS -o /tmp/mcp-submit.json -w "%{http_code}" \
            -X POST "https://neuronto.com/submit" \
            -H "Content-Type: application/json" \
            --data-binary "$MCP_PAYLOAD")
          echo "Neuronto MCP submit HTTP $MCP_STATUS"
          jq -c '{
            status:(.status // null),
            id:(.submission.id // .id // .submissionId // .submission_id // null),
            endpoint:(.endpoint // null),
            reason:(.reason // null),
            detail:(.detail // null),
            retryStatusUrl:(.retry.status_url // .submission.status_url // null),
            evidenceStatus:(.evidence.status // .evidence.http_status // null)
          }' /tmp/mcp-submit.json || true
          case "$MCP_STATUS" in
            200) ;;
            202)
              MCP_ID=$(jq -r '.submission.id // .id // .submissionId // .submission_id // empty' /tmp/mcp-submit.json)
              if [ -n "$MCP_ID" ]; then
                for attempt in $(seq 1 12); do
                  MS=$(curl -sS -o /tmp/mcp-status.json -w "%{http_code}" "https://neuronto.com/submit/status/$MCP_ID")
                  if [ "$MS" = "200" ]; then
                    MSTATE=$(jq -r '.status // .state // empty' /tmp/mcp-status.json)
                    echo "Neuronto MCP state: $MSTATE"
                    case "$MSTATE" in
                      indexed|verified|complete|completed|success) break ;;
                      failed|rejected|exhausted) cat /tmp/mcp-status.json; exit 1 ;;
                    esac
                  fi
                  sleep 5
                done
              fi
              ;;
            *)
              cat /tmp/mcp-submit.json || true
              exit 1
              ;;
          esac

          PAYLOAD=$(jq -nc --arg domain "$DOMAIN" '{domain:$domain}')
          STATUS=$(curl -sS -o /tmp/submit.json -w "%{http_code}" \
            -X POST "https://neuronto.com/submit" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD")
          echo "Neuronto submit HTTP $STATUS"
          jq -c '{status:(.status // null),id:(.id // .submissionId // .submission_id // null),indexed:(.indexed // null),entries:(.entries // .entryCount // null)}' /tmp/submit.json || true

          case "$STATUS" in
            200) ;;
            202)
              ID=$(jq -r '.id // .submissionId // .submission_id // empty' /tmp/submit.json)
              if [ -n "$ID" ]; then
                for attempt in $(seq 1 12); do
                  S=$(curl -sS -o /tmp/status.json -w "%{http_code}" "https://neuronto.com/submit/status/$ID")
                  if [ "$S" = "200" ]; then
                    STATE=$(jq -r '.status // .state // empty' /tmp/status.json)
                    echo "Neuronto state: $STATE"
                    case "$STATE" in
                      indexed|verified|complete|completed|success) break ;;
                      failed|rejected|exhausted) cat /tmp/status.json; exit 1 ;;
                    esac
                  fi
                  sleep 5
                done
              fi
              ;;
            *)
              jq -c '{detail:(.detail // .error // .message // null)}' /tmp/submit.json || true
              exit 1
              ;;
          esac

          AUDIT_PAYLOAD=$(jq -nc --arg domain "$DOMAIN" '{domain:$domain}')
          AUDIT_STATUS=$(curl -sS -o /tmp/audit.json -w "%{http_code}" \
            -X POST "https://neuronto.com/audit" \
            -H "Content-Type: application/json" \
            --data-binary "$AUDIT_PAYLOAD")
          echo "Neuronto audit HTTP $AUDIT_STATUS"
          if [ "$AUDIT_STATUS" = "200" ]; then
            jq -c '{manifestReachable:(.manifest.reachable // .discovery.manifestReachable // null),conformant:(.conformant // .manifest.conformant // null),entryCount:(.entryCount // ((.entries // [])|length))}' /tmp/audit.json || true
          fi

          echo "--- Neuronto publisher index state ---"
          AGENTS_STATUS=$(curl -sS -G -o /tmp/agents.json -w "%{http_code}" \
            --data-urlencode "filter=publisher=$DOMAIN" \
            --data-urlencode "pageSize=100" \
            "https://neuronto.com/agents")
          echo "Neuronto agents HTTP $AGENTS_STATUS"
          if [ "$AGENTS_STATUS" = "200" ]; then
            jq -c '{totalSize:(.totalSize // null),count:((.items // [])|length),items:[(.items // [])[] | {identifier,displayName,type,url,representativeQueries,tags,capabilities}]}' /tmp/agents.json
          fi

          echo "--- Neuronto audit shape ---"
          jq -c '{keys:(keys), manifest:(.manifest // null), discovery:(.discovery // null), entries:(.entries // null), representativeQueries:(.representativeQueries // null)}' /tmp/audit.json || true
          QUERIES=(
            "normalize JSON"
            "classify a URL without fetching"
            "validate EVM wallet address format"
            "lab-only A2A agent for capability discovery"
          )
          for Q in "${QUERIES[@]}"; do
            SEARCH_PAYLOAD=$(jq -nc --arg q "$Q" '{query:{text:$q},federation:"none",pageSize:20}')
            SEARCH_STATUS=$(curl -sS -o /tmp/search.json -w "%{http_code}" \
              -X POST "https://neuronto.com/search" \
              -H "Content-Type: application/json" \
              --data-binary "$SEARCH_PAYLOAD")
            if [ "$SEARCH_STATUS" != "200" ]; then
              echo "NEURONTO | query=$Q | http=$SEARCH_STATUS"
              continue
            fi
            RANK=$(jq -r --arg domain "$DOMAIN" '
              [(.entries // .results // .items // [])[] |
                {id:(.identifier // .entry.identifier // ""),url:(.url // .entry.url // ""),name:(.displayName // .entry.displayName // "")}] |
              to_entries |
              map(select((.value.id|contains($domain)) or (.value.url|contains($domain)) or (.value.name=="MACH Agent Lab Edge"))) |
              if length>0 then (.[0].key+1) else 0 end
            ' /tmp/search.json)
            COUNT=$(jq -r '(.entries // .results // .items // []) | length' /tmp/search.json)
            COVERAGE=$(jq -r '.queryMatch.coverage // null' /tmp/search.json)
            CONFIDENCE=$(jq -r '.queryMatch.confidence // null' /tmp/search.json)
            echo "NEURONTO | query=$Q | rank=$RANK | page_results=$COUNT | coverage=$COVERAGE | confidence=$CONFIDENCE"
            if [ "$RANK" = "0" ] || [ "$RANK" -gt 3 ]; then
              echo "NEURONTO_TOP | query=$Q"
              jq -c '[((.entries // .results // .items // [])[0:10])[] | {
                rank:(input_line_number),
                identifier:(.identifier // .entry.identifier // null),
                displayName:(.displayName // .entry.displayName // null),
                description:(.description // .entry.description // null),
                representativeQueries:(.representativeQueries // .entry.representativeQueries // []),
                capabilities:(.capabilities // .entry.capabilities // []),
                score:(.score // null),
                source:(.source // null)
              }]' /tmp/search.json || true
            fi
          done

          echo "--- Neuronto verified tool search ---"
          TOOL_QUERIES=("normalize JSON" "classify URL without fetching" "validate EVM wallet address format")
          for Q in "${TOOL_QUERIES[@]}"; do
            ENCODED=$(jq -rn --arg v "$Q" '$v|@uri')
            TSTATUS=$(curl -sS -o /tmp/tools.json -w "%{http_code}" "https://neuronto.com/tools?q=$ENCODED&limit=20")
            if [ "$TSTATUS" != "200" ]; then
              echo "NEURONTO_TOOL | query=$Q | http=$TSTATUS"
              continue
            fi
            TRANK=$(jq -r '
              [(.results // .tools // .items // [])[] |
                {name:(.tool // .name // ""), endpoint:(.endpoint // ""), server:(.server // "")}] |
              to_entries |
              map(select(
                (.value.name == "normalize_json") or
                (.value.name == "classify_url_without_fetching") or
                (.value.name == "validate_evm_wallet_address_format") or
                (.value.endpoint | tostring | contains("mach-agent-lab-edge")) or
                (.value.server | tostring | contains("MACH Agent Lab"))
              )) |
              if length>0 then (.[0].key+1) else 0 end
            ' /tmp/tools.json)
            TCOUNT=$(jq -r '(.results // .tools // .items // []) | length' /tmp/tools.json)
            echo "NEURONTO_TOOL | query=$Q | rank=$TRANK | page_results=$TCOUNT"
          done
